<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t">
  <title id="t">LLMTraceFX</title>
  <desc>Monochrome symbol. Inherits currentColor, so it is safe on any ground and in one-colour reproduction.</desc>
  <!--
    LLMTraceFX identity. Two routed traces converge on one solid pad: the heavy
    trace is the measured run that carried the decision, the hairline trace is
    the evidence weighed beside it. Both turn at 45 degrees the way a routed
    path does, and both stop at the pad, because a recommendation is only as
    long as the evidence behind it. The same routing grammar draws the letters.
  -->
  <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M3 8H10L16 14H19" stroke-width="3.5" />
    <path d="M3 24H10L16 18H19" stroke-width="1.75" />
  </g>
  <rect x="18" y="10.5" width="11" height="11" fill="currentColor" />
</svg>
