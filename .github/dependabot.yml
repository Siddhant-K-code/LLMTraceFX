# Dependabot configuration.
#
# The github-actions block matters here because ci.yml and codeql.yml pin every
# action to a commit SHA. Pinned SHAs do not drift, which is the point, but it
# also means they never pick up security fixes unless something bumps them.
# Dependabot understands the "# vX.Y.Z" comment next to each pin and updates
# both the SHA and the comment together.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dev-tooling:
        patterns:
          - "black"
          - "isort"
          - "mypy"
          - "ruff"
          - "pytest*"
          - "pre-commit"
    # The MLX runtime is a certified pin, not a routine dependency. The cache
    # audit refuses any mlx/mlx-lm but the pinned pair, expected.py models
    # that mlx-lm's prompt cache, and the reference bundle and lab
    # manifests record these exact versions. Upgrading means re-certifying
    # that evidence by hand, so Dependabot must not propose it. This also
    # suppresses security-update PRs for these packages; alerts still show.
    ignore:
      - dependency-name: "mlx"
      - dependency-name: "mlx-lm"
      - dependency-name: "mlx-vlm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
