# Publish a release to PyPI with trusted publishing (OIDC), then move the
# floating major tag (v1 for 1.x) so `uses: Siddhant-K-code/LLMTraceFX@v1`
# picks up the release.
#
# One-time setup is in docs/releasing.md. No PyPI token is stored anywhere:
# the publish job exchanges a short-lived OIDC token for an upload token, and
# only that job, in the `pypi` environment, can request one.
#
# workflow_dispatch rebuilds and republishes an existing tag, for example to
# publish a release made before this workflow existed or to retry a failure.
# PyPI refuses to overwrite files, so republishing a version already on PyPI
# fails at the upload step without changing anything.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.10.0
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      major: ${{ steps.tag.outputs.major }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z, got '$TAG'"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "major=${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Record the tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No dependency cache: a release build should not restore state that
      # other workflows can write.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Check the project version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          project_version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$project_version" != "$VERSION" ]; then
            echo "::error::pyproject.toml version is $project_version but the tag is v$VERSION"
            exit 1
          fi

      # uv build makes the sdist first and then builds the wheel from that
      # sdist, so a file missing from the sdist fails here or in the checks
      # below rather than after upload.
      - name: Build sdist and wheel
        run: |
          uv sync --locked --extra build
          uv build --no-build-isolation

      - name: Verify distributions
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          sdist="dist/llmtracefx-$VERSION.tar.gz"
          wheel="dist/llmtracefx-$VERSION-py3-none-any.whl"
          test -f "$sdist"
          test -f "$wheel"
          test "$(find dist -maxdepth 1 -type f ! -name .gitignore | wc -l)" -eq 2
          uvx --from twine==7.0.0 twine check --strict "$sdist" "$wheel"
          git ls-files -- 'llmtracefx/**/data/*.json' 'vllm_kv_truth/data/*.json' > "$RUNNER_TEMP/required-data.txt"
          test -s "$RUNNER_TEMP/required-data.txt"
          uv run --no-project python - "$sdist" "$wheel" "$VERSION" "$RUNNER_TEMP/required-data.txt" <<'EOF'
          import sys
          import tarfile
          import zipfile
          from email.parser import Parser

          sdist, wheel, version, required = sys.argv[1:]
          prefix = f"llmtracefx-{version}"
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              meta = Parser().parsestr(
                  zf.read(f"{prefix}.dist-info/METADATA").decode()
              )
          with tarfile.open(sdist) as tf:
              pkg_info = Parser().parsestr(
                  tf.extractfile(f"{prefix}/PKG-INFO").read().decode()
              )
          for label, m in (("wheel", meta), ("sdist", pkg_info)):
              assert m["Name"] == "llmtracefx", (label, m["Name"])
              assert m["Version"] == version, (label, m["Version"], version)
          missing = [
              path
              for path in open(required).read().split()
              if path not in names
          ]
          assert not missing, f"package data missing from wheel: {missing}"
          script = f"{prefix}.data/scripts/run-vllm-kv-truth-clean-env.py"
          assert script in names, f"{script} missing from wheel"
          print(f"{len(names)} files in wheel, metadata version {version}")
          EOF

      - name: Install the wheel in a clean environment
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check/bin/python" \
            "dist/llmtracefx-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -c "
          import importlib.metadata as md
          import llmtracefx
          assert md.version('llmtracefx') == '$VERSION'
          print('imported', llmtracefx.__file__)
          "
          "$RUNNER_TEMP/wheel-check/bin/llmtracefx-evidence" --help > /dev/null
          test -x "$RUNNER_TEMP/wheel-check/bin/run-vllm-kv-truth-clean-env.py"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/llmtracefx/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: exchange an OIDC token for a PyPI upload token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  move-major-tag:
    name: move floating major tag
    needs: [build, publish]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the annotated tag object and move refs/tags/vMAJOR
    steps:
      - name: Point the major tag at the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          MAJOR: ${{ needs.build.outputs.major }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$MAJOR" -lt 1 ]; then
            echo "::notice::No floating tag for 0.x releases"
            exit 0
          fi
          floating="v$MAJOR"
          # Only the highest vMAJOR.Y.Z release moves the tag, so publishing a
          # patch for an older minor line never moves users backwards.
          latest="$(
            gh api --paginate "repos/$REPO/git/matching-refs/tags/v$MAJOR." --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E "^v$MAJOR\.[0-9]+\.[0-9]+$" \
              | sort -V \
              | tail -n 1
          )"
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::Leaving $floating alone: $latest is newer than $TAG"
            exit 0
          fi
          tag_object="$(
            gh api "repos/$REPO/git/tags" \
              -f tag="$floating" \
              -f object="$SHA" \
              -f type=commit \
              -f message="Latest $floating.x release: $TAG" \
              --jq .sha
          )"
          if gh api "repos/$REPO/git/ref/tags/$floating" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$floating" \
              -f sha="$tag_object" -F force=true --silent
          else
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/tags/$floating" -f sha="$tag_object" --silent
          fi
          echo "Moved \`$floating\` to \`$TAG\` (\`$SHA\`)." >> "$GITHUB_STEP_SUMMARY"
