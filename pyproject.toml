[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtracefx"
version = "1.0.0"
description = "Evidence-first inference measurement, verification, and constrained optimization toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "LLMTraceFX Team", email = "info@llmtracefx.com"},
]
keywords = ["llm", "inference", "benchmarking", "verification", "optimization", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.9.0",
    "plotly>=7.0.0",
    "pandas>=2.2.2",
    "numpy>=2.2.6",
    "python-multipart>=0.0.6",
    "streamlit>=1.34.0",
]

[project.optional-dependencies]
# Modal is an optional extra, not a runtime dependency. Nothing in the
# library imports it at module scope: `llmtracefx.api.serve` guards its
# import, and the deployment planner (`llmtracefx.deploy`) is pure Python
# so `llmtracefx-deploy plan` and the whole test suite run with Modal
# absent. Only the `modal run`/`modal deploy` entrypoints need it.
#
# The floor is 1.0.5 because that is the version whose API surface the
# GLM entrypoint was written against: `@modal.web_server`,
# `@modal.concurrent`, and the `max_containers`/`min_containers`/
# `scaledown_window` parameters. The newer `@app.server()` decorator does
# not exist at this floor and is deliberately not used.
modal = [
    "modal>=1.0.5",
]

# Dedicated extra for the Modal L4 crossover *execution* path
# (`llmtracefx-modal-l4-execute`). Unlike the GLM deployment, whose API
# surface is stable across the 1.x line and only needs the >=1.0.5 floor
# above, the L4 crossover orchestrator and its capability probe were written
# and tested against the exact API of modal 1.5.5 (for example the read-only
# volume mount `Volume.with_mount_options(read_only=True)` and the
# `FunctionCall.cancel(terminate_containers=True)` teardown). It is pinned
# exactly so a silent SDK upgrade cannot move that surface under a paid run.
# It is a separate extra, so the GLM `modal` constraint above is unchanged.
# Note what that does and does not mean: uv resolves one `modal` entry for the
# whole project, so adding this pin moved the locked version from 1.5.4 to
# 1.5.5, and a locked `uv sync --extra modal` for GLM now installs 1.5.5 too.
# The GLM *constraint* is untouched; the resolved GLM install is not.
# Install it with `uv sync --extra modal-l4-execute`.
modal-l4-execute = [
    "modal==1.5.5",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "ruff>=0.12.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

mlx = [
    "mlx==0.32.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-vlm==0.6.8; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "transformers==5.16.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Siddhant-K-code/LLMTraceFX"
Repository = "https://github.com/Siddhant-K-code/LLMTraceFX"
Issues = "https://github.com/Siddhant-K-code/LLMTraceFX/issues"

[project.scripts]
llmtracefx = "llmtracefx.main:main"
llmtracefx-serve = "llmtracefx.api.serve:main"
llmtracefx-dashboard = "llmtracefx.realtime_dashboard:main"
llmtracefx-optimizer = "llmtracefx.optimizer.cli:main"
llmtracefx-deploy = "llmtracefx.deploy.cli:main"
llmtracefx-cloudrift = "llmtracefx.deploy.cloudrift_cli:main"
llmtracefx-m5-lab = "llmtracefx.optimizer.lab.cli:main"
llmtracefx-m5-frontier = "llmtracefx.optimizer.lab.frontier:main"
llmtracefx-m5-control = "llmtracefx.optimizer.lab.qwen3_8b.cli:main"
llmtracefx-vllm-crossover = "llmtracefx.optimizer.lab.qwen3_8b.cloudrift_crossover:main"
llmtracefx-vllm-crossover-results = "llmtracefx.optimizer.lab.qwen3_8b.cloudrift_crossover_results:main"
llmtracefx-modal-l4-crossover = "llmtracefx.optimizer.lab.qwen3_8b.modal_l4_crossover:main"
llmtracefx-modal-l4-crossover-evidence = "llmtracefx.optimizer.lab.qwen3_8b.modal_l4_crossover_evidence:main"
llmtracefx-modal-l4-execute = "llmtracefx.optimizer.lab.qwen3_8b.modal_l4_execute:main"
llmtracefx-evidence = "llmtracefx.evidence.cli:main"
llmtracefx-cache-audit = "llmtracefx.cache_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmtracefx*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
llmtracefx = [
    "test_traces/*.json",
    "*.md",
    "optimizer/lab/data/*.json",
    "optimizer/lab/qwen3_8b/data/*.json",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["llmtracefx"]
known_third_party = ["fastapi", "uvicorn", "aiohttp", "plotly", "pandas", "numpy", "modal", "streamlit"]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "pandas.*",
    "numpy.*",
    "modal.*",
    "huggingface_hub.*",
    "mlx.*",
    "mlx_lm.*",
    "mlx_vlm.*",
    "uvicorn.*",
    "streamlit.*",
]
ignore_missing_imports = true

# The Modal entrypoint is decorated by an optional dependency. When the
# `modal` extra is not installed the decorators resolve to Any, which
# `disallow_untyped_decorators` reports on every decorated function. That
# check cannot say anything useful about a module whose decorators come
# from a package the type checker was not given, and the rest of the
# strict settings still apply here.
[[tool.mypy.overrides]]
module = [
    "llmtracefx.deploy.modal_glm_app",
    "llmtracefx.modal_app",
    "llmtracefx.optimizer.lab.qwen3_8b.modal_l4_app",
]
disallow_untyped_decorators = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--asyncio-mode=auto",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["llmtracefx"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration (alternative to flake8)
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
